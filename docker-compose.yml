services:

  localstack:
    container_name: kong-aws-localstack
    # NOTE:
    # We are intentionally pinning LocalStack to version 4.14.0.
    #
    # Newer versions (2025+ / 2026.x) bundle Pro features and enforce license activation,
    # which causes containers to fail to start without a valid auth token.
    #
    # Version 4.14.0 is the last stable OSS-only release that:
    # - does NOT require Pro licensing
    # - does NOT force license activation
    # - provides main AWS services (CloudFormation, S3, etc.)
    image: localstack/localstack:4.14.0
    ports:
      # LocalStack exposes AWS-compatible APIs (not a web UI)
      # Use via AWS CLI, boto3, or health endpoint,
      # such as: curl http://localhost:4566/_localstack/health
      - "4566:4566"
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      USE_SSL: 0
      DEBUG: ${DEBUG:-0}
      LOCALSTACK_SSL_NO_VERIFY: 1 # dev only
      PERSISTENCE: ${PERSISTENCE:-0}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - "./tests:/etc/localstack/tests"
      - "./localstack/data:/var/lib/localstack"
      - "./localstack/init:/etc/localstack/init"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      retries: 5
      timeout: 5s
      interval: 10s
      start_period: 10s

  postgres:
    image: postgres:13

    container_name: kong-postgres

    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      timeout: 5s
      retries: 10
      interval: 5s

  # Kong stores its configuration metadata in PostgreSQL. The migration container
  # initializes and upgrades the Kong database schema before the Kong server starts,
  # similar to Flyway/Liquibase migrations in application deployments.
  kong-migrations:
    image: kong:3.9

    depends_on:
      postgres:
        condition: service_healthy

    command: kong migrations bootstrap

    environment:
      KONG_PG_PORT: 5432
      KONG_PG_HOST: postgres
      KONG_DATABASE: postgres

      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong

    restart: on-failure

  # Kong in local development mirrors production:
  # Kong -> PostgreSQL -> deck gateway sync
  kong:
    image: kong:3.9

    container_name: kong

    depends_on:
      localstack:
        condition: service_healthy

      postgres:
        condition: service_healthy

      kong-migrations:
        condition: service_completed_successfully

    environment:
      KONG_PG_PORT: 5432
      KONG_PG_HOST: postgres
      KONG_DATABASE: postgres

      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong

      KONG_ADMIN_LISTEN: 0.0.0.0:8001

      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout

      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "8000:8000" # Proxy (API traffic)
      - "8001:8001" # Admin API
      - "8002:8002" # Kong Manager (Admin GUI)

    healthcheck:
      test: [ "CMD", "kong", "health" ]
      retries: 5
      timeout: 5s
      interval: 10s
