_format_version: "3.0"

# PoC note:
#
# Demonstrates direct Kong → Lambda invocation using the aws-lambda plugin.
#
# Validate via:
#   curl -i 'http://localhost:8000/poc/lambda/cmdb/account_category'
#
# Unlike cmdb-api.yml, this bypasses API Gateway entirely.
services:
  - enabled: true

    name: ${{ env "DECK_CMDB_API_NAME" }}-lambda

    # Dummy upstream.
    # The aws-lambda plugin performs the invocation.
    url: http://localhost:65535

    routes:
      - name: ${{ env "DECK_CMDB_API_NAME" }}-lambda-route

        paths:
          - /poc/lambda/cmdb

        methods:
          - GET

        # Remove the PoC-specific route prefix before invoking Lambda.
        # e.g. /poc/lambda/cmdb/account_category -> /account_category
        strip_path: true

    plugins:
      - name: aws-lambda

        enabled: true

        config:
          aws_region: ap-southeast-2
          awsgateway_compatible: true
          function_name: ${{ env "DECK_CMDB_LAMBDA_ARN" }}

          log_type: None
          invocation_type: RequestResponse

          is_proxy_integration: true

          forward_request_uri: true
          forward_request_body: true
          forward_request_method: true
          forward_request_headers: true