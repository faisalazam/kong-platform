services:

  postgres:
    image: postgres:13

    container_name: kong-postgres

    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      timeout: 5s
      retries: 10
      interval: 5s

  # Kong stores its configuration metadata in PostgreSQL. The migration container
  # initializes and upgrades the Kong database schema before the Kong server starts,
  # similar to Flyway/Liquibase migrations in application deployments.
  kong-migrations:
    image: kong:3.9

    depends_on:
      postgres:
        condition: service_healthy

    command: kong migrations bootstrap

    environment:
      KONG_PG_PORT: 5432
      KONG_PG_HOST: postgres
      KONG_DATABASE: postgres

      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong

    restart: on-failure

  # Kong in local development mirrors production:
  # Kong -> PostgreSQL -> deck gateway sync
  kong:
    image: kong:3.9

    container_name: kong

    depends_on:
      postgres:
        condition: service_healthy

      kong-migrations:
        condition: service_completed_successfully

    environment:
      KONG_PG_PORT: 5432
      KONG_PG_HOST: postgres
      KONG_DATABASE: postgres

      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong

      KONG_ADMIN_LISTEN: 0.0.0.0:8001

      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout

    ports:
      - "8000:8000" # Proxy (API traffic)
      - "8001:8001" # Admin API
      - "8002:8002" # Kong Manager (Admin GUI)

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "kong", "health" ]
      retries: 5
      timeout: 5s
      interval: 10s
