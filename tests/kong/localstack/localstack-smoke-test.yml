_format_version: "3.0"

services:
  - enabled: true

    name: localstack-lambda

    url: http://localhost:65535

    routes:
      - name: localstack-lambda-route

        paths:
          - /poc/localstack

        methods:
          - GET

        strip_path: true

    plugins:
      - name: aws-lambda

        enabled: true

        config:
          function_name: localstack-smoke-test

          aws_region: ap-southeast-2

          port: 4566
          host: localstack

          disable_https: true

          awsgateway_compatible: true

          invocation_type: RequestResponse

          forward_request_uri: true
          forward_request_method: true
          forward_request_headers: true
          forward_request_body: true
